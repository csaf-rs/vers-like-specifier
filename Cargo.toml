[package]
name = "vers-like-specifier"
version = "0.1.0"
edition = "2024"
description = "vls (vers-like specifier) parser"
license = "Apache-2.0"
repository = "https://github.com/csaf-rs/vers-like-specifier"
readme = "README.md"
keywords = ["vls", "vers-like", "purl", "vers", "parser"]
categories = ["parser-implementations"]
rust-version = "1.88.0"
publish = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "*", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys", "dep:tsify", "dep:console_error_panic_hook"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rstest = "0.26.1"
wasm-bindgen-test = "0.3"

[[bench]]
name = "parsing_bench"
harness = false
